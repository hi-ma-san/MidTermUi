<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidTermUi - 3x3 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 800px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 24pt;
            font-weight: bold;
            border: 1px solid #8f8f91;
            border-radius: 4px;
            background: qlineargradient(x1:0, y1:0, x2:0, y2:1, 
                stop:0 #f0f0f0, stop:1 #e0e0e0);
            cursor: pointer;
            transition: all 0.1s;
        }

        button:hover {
            background: qlineargradient(x1:0, y1:0, x2:0, y2:1, 
                stop:0 #e8e8e8, stop:1 #d8d8d8);
        }

        button:active {
            background: qlineargradient(x1:0, y1:0, x2:0, y2:1, 
                stop:0 #d8d8d8, stop:1 #c8c8c8);
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <button id="button_0_0">O</button>
        <button id="button_0_1">X</button>
        <button id="button_0_2">X</button>
        <button id="button_1_0">X</button>
        <button id="button_1_1">O</button>
        <button id="button_1_2">X</button>
        <button id="button_2_0">X</button>
        <button id="button_2_1">X</button>
        <button id="button_2_2">O</button>
    </div>
</body>
</html>
